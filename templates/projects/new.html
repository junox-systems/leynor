{% extends "base_app.html" %}

{% block title %}New project — {{ app_name }}{% endblock %}
{% block page_title %}New project{% endblock %}

{% block content %}
<div class="w-full max-w-xl space-y-6">
    <c-breadcrumb back="Projects" back_url="{% url 'projects' %}" current="New" />

    <c-card title="Create a project"
            description="The project is the workspace. Campaigns and their output units live inside it."
            lead>
        <c-form>
            <c-fields :form="form" />
            <c-btn type="submit">Create</c-btn>
        </c-form>
    </c-card>
</div>
{% endblock %}
