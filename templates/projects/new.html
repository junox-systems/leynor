{% extends "base_app.html" %}

{% block title %}New reel — {{ app_name }}{% endblock %}
{% block page_title %}New reel{% endblock %}

{% block content %}
<div class="w-full max-w-xl space-y-6">
    <c-breadcrumb back="Reels" back_url="{% url 'projects' %}" current="New" />

    <c-card title="Start a reel"
            description="The title and the seconds are the only decisions here. Every reel opens with all six gates waiting; you pass each one in turn."
            lead>
        <c-form>
            <c-fields :form="form" />
            <c-btn type="submit">Start</c-btn>
        </c-form>
    </c-card>
</div>
{% endblock %}
