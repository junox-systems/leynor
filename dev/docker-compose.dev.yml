# For development environment.
#
# The compose project name is the app slug, so containers, networks and
# volumes are namespaced per app instead of per directory. Without it,
# compose names the project after the compose file's folder ("dev") and two
# apps built from the same kit share a database.
name: ${APP_SLUG:-leynor}

services:
  db:
    image: paradedb/paradedb:0.26.2-pg18
    container_name: ${APP_SLUG:-leynor}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: ${POSTGRES_DB:-${APP_SLUG:-leynor}}
    volumes:
      - postgres_data:/var/lib/postgresql
    # No host port: everything, including manage.py from the app container,
    # reaches the database as db:5432 on the compose network, so a local
    # Postgres on 5432 cannot clash.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-${APP_SLUG:-leynor}}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickstack:
    image: clickhouse/clickstack-local:2.33.0
    container_name: ${APP_SLUG:-leynor}-clickstack
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - clickstack_db:/data/db
      - clickstack_ch_data:/var/lib/clickhouse
      - clickstack_ch_logs:/var/log/clickhouse-server

  app:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    container_name: ${APP_SLUG:-leynor}-app
    restart: unless-stopped
    # A model server on the host (Ollama, LM Studio) is http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/${POSTGRES_DB:-${APP_SLUG:-leynor}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://clickstack:4317
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - VITE_HYPERDX_URL=http://localhost:4318
      - VITE_HYPERDX_SERVICE=${APP_SLUG:-leynor}-frontend
      - APP_ARTIFACT_ENDPOINT_URL=http://s3:8333
      - APP_ARTIFACT_ACCESS_KEY=leynor-dev
      - APP_ARTIFACT_SECRET_KEY=leynor-dev-secret
    volumes:
      - ..:/app
      - python_venv:/app/.venv
      - frontend_node_modules:/app/frontend/node_modules
      # Baked into the image for a plain `docker run`; mounted here so edits to
      # the startup script apply on `restart` without rebuilding.
      - ./init.sh:/init.sh:ro
    ports:
      - "8000:8000" # Django
      - "5173:5173" # Vite
    networks:
      - default

  # Reel artifacts: the same SeaweedFS S3 store the stack runs, so web and both
  # workers share bytes exactly as in production. No host port: the reel page
  # streams files through Django, as it does in production.
  s3:
    image: chrislusf/seaweedfs:4.52
    container_name: ${APP_SLUG:-leynor}-s3
    restart: unless-stopped
    command: server -s3 -dir=/data
    environment:
      # With no -s3.config, these become the one admin identity.
      - AWS_ACCESS_KEY_ID=leynor-dev
      - AWS_SECRET_ACCESS_KEY=leynor-dev-secret
    volumes:
      - s3_data:/data
    networks:
      - default

  # One heavy worker: torch, whisper, ffmpeg and Chromium live only here.
  heavy:
    build:
      context: ..
      dockerfile: dev/Dockerfile.heavy
    container_name: ${APP_SLUG:-leynor}-heavy
    restart: unless-stopped
    # A model server on the host (Ollama, LM Studio) is http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/${POSTGRES_DB:-${APP_SLUG:-leynor}}
      - Q_CLUSTER_ROLE=heavy
      - Q_CLUSTER_WORKERS=1
      - Q_CLUSTER_TIMEOUT=3600
      - Q_CLUSTER_RETRY=3900
      - OTEL_ENABLED=false
      - APP_ARTIFACT_ENDPOINT_URL=http://s3:8333
      - APP_ARTIFACT_ACCESS_KEY=leynor-dev
      - APP_ARTIFACT_SECRET_KEY=leynor-dev-secret
    volumes:
      - ..:/app
      - heavy_venv:/app/.venv
    networks:
      - default

volumes:
  postgres_data:
  s3_data:
  python_venv:
  heavy_venv:
  frontend_node_modules:
  clickstack_db:
  clickstack_ch_data:
  clickstack_ch_logs:
