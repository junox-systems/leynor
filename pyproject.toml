[project]
name = "reel-playbook"
version = "0.1.0"
description = "One gated route from an idea to a rendered 9:16 Reel, as a state machine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.11",
  "pydantic-ai>=2.60,<3",
  "pocket-tts>=4.0.1",
  "torch>=2.6",
  "faster-whisper>=1.1",
  "psycopg[binary]>=3.2",
  "django>=5.2",
]

[project.scripts]
reel = "reel_playbook.cli:main"

[project.optional-dependencies]
audit = ["librosa>=0.11", "numpy>=2", "soundfile>=0.13"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_playbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
